<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tendercare Staff Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   All styles preserved exactly as before — no changes.
   ================================================================ */

:root {
  --color-purple:        #5B2D8E;
  --color-purple-deep:   #3A1A5C;
  --color-purple-mid:    #7B4DB0;
  --color-purple-light:  #C4A8E0;
  --color-purple-ghost:  #F0E8FA;
  --color-lemon-ghost:   #FBF6D8;
  --color-cream:         #F8F4EC;
  --color-cream-warm:    #F0E8D8;
  --color-cream-deep:    #E4D8C4;
  --color-offwhite:      #FDFAF5;
  --color-ash:           #A8A8B0;
  --color-ash-dark:      #6C6C78;
  --color-ash-light:     #D4D4DC;
  --color-ink:           #1A1020;
  --color-white:         #FFFFFF;
  --color-wine:          #9C2B2B;

  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans:  'DM Sans', system-ui, sans-serif;

  --text-xs:  0.75rem;
  --text-sm:  0.875rem;
  --text-md:  1.125rem;
  --text-lg:  1.25rem;
  --text-2xl: 2rem;

  --space-1: 0.25rem;  --space-2: 0.5rem;  --space-3: 0.75rem;
  --space-4: 1rem;     --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem;     --space-12: 3rem;   --space-16: 4rem;

  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-full: 999px;
  --shadow-sm: 0 1px 4px rgba(26,16,32,0.08);
  --shadow-md: 0 4px 16px rgba(26,16,32,0.12);
  --duration-fast: 150ms; --duration-base: 300ms;
  --tracking-wide: 0.08em;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--color-offwhite);
  color: var(--color-ink);
  font-family: var(--font-sans);
}
a { color: inherit; }
button { font: inherit; cursor: pointer; border: none; background: none; }
input, select { font: inherit; }

.session-check, .loading-note {
  text-align: center;
  padding: 4rem 1rem;
  opacity: 0.6;
}
.page-error {
  background: #fdecea;
  border: 1px solid #f5c6c0;
  color: var(--color-wine);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-5);
  font-size: var(--text-sm);
}

.staff-shell-bar {
  background: var(--color-purple-deep);
  color: var(--color-white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
}
.staff-shell-left { display: flex; align-items: center; gap: 0.75rem; }
.staff-shell-crest { width: 2.1rem; height: auto; color: var(--color-purple-light); flex-shrink: 0; }
.staff-shell-titles { line-height: 1.25; }
.staff-shell-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; }
.staff-shell-subtitle { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; }
.staff-shell-right { display: flex; align-items: center; gap: 0.6rem; }
.staff-shell-role-pill {
  background: var(--color-purple);
  color: var(--color-white);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.35rem 0.85rem;
  border-radius: var(--radius-full);
}
#shell-content { max-width: 900px; margin: 0 auto; padding: var(--space-8) var(--space-5); }

.landing {
  position: relative; overflow: hidden; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: var(--space-16) var(--space-5) var(--space-16);
  background: var(--color-cream);
}
.landing-crest-watermark {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(70vw, 640px); height: auto; color: var(--color-purple-deep);
  opacity: 0.045; pointer-events: none; z-index: 0;
}
.landing-header { position: relative; z-index: 1; text-align: center; max-width: 42ch; margin-bottom: var(--space-12); }
.landing-crest { width: 3.5rem; height: auto; color: var(--color-purple-deep); margin: 0 auto var(--space-3); display: block; }
.landing-header h1 { font-family: var(--font-serif); font-weight: 400; font-size: var(--text-2xl); color: var(--color-purple-deep); margin: 0 0 var(--space-2); }
.landing-header p { opacity: 0.7; font-size: var(--text-sm); margin: 0; }
.landing-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); width: 100%; max-width: 640px; }
.landing-card {
  display: flex; flex-direction: column; gap: var(--space-1);
  background: var(--color-white); border: 1px solid var(--color-cream-deep);
  border-radius: var(--radius-lg); padding: var(--space-5);
  text-decoration: none; color: inherit; position: relative;
  transition: transform var(--duration-base), box-shadow var(--duration-base), border-color var(--duration-base);
}
.landing-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--color-purple-light); }
.landing-card-title { font-family: var(--font-serif); font-weight: 600; font-size: var(--text-md); color: var(--color-ink); }
.landing-card-desc { font-size: var(--text-xs); color: var(--color-ash-dark); line-height: 1.5; }
.landing-card-arrow { position: absolute; top: var(--space-4); right: var(--space-4); color: var(--color-purple-light); font-size: var(--text-lg); transition: transform var(--duration-fast); }
.landing-card:hover .landing-card-arrow { transform: translateX(3px); color: var(--color-purple); }
@media (max-width: 560px) { .landing-grid { grid-template-columns: 1fr; } }

.roster-page { max-width: 900px; margin: 0 auto; }
.roster-subtitle { opacity: 0.7; max-width: 60ch; font-size: var(--text-sm); }
.add-student form { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-8); }
.add-student input[type='text'] { flex: 1; min-width: 220px; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: var(--radius-md); }
.add-student select, .add-student button { padding: 0.6rem 0.8rem; border-radius: var(--radius-md); }
.add-student button { background: var(--color-purple); color: white; font-weight: 600; }
.roster-list-header { display: flex; justify-content: space-between; align-items: center; }
.show-inactive-toggle { font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; }
table { width: 100%; border-collapse: collapse; margin-top: var(--space-4); }
th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid #eee; font-size: var(--text-sm); }
.inactive-row { opacity: 0.5; }
.actions-cell { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
.btn-remove { color: var(--color-wine); }
.btn-restore { color: #060; }
.btn-erase, .btn-erase-confirm { color: var(--color-wine); font-weight: 600; }
.erase-confirm { font-size: 0.85rem; max-width: 40ch; background: #fff3f3; padding: 0.5rem; border-radius: var(--radius-sm); display: flex; flex-direction: column; gap: 0.4rem; }

.page-header h1 { font-family: var(--font-serif); font-weight: 400; font-size: var(--text-2xl); color: var(--color-purple-deep); margin: 0 0 var(--space-2); }
.page-subtitle { font-size: var(--text-sm); color: var(--color-ash-dark); max-width: 65ch; margin: 0 0 var(--space-6); }
.add-card { background: var(--color-white); border: 1px solid var(--color-cream-deep); border-radius: var(--radius-lg); padding: var(--space-5); margin-bottom: var(--space-8); box-shadow: var(--shadow-sm); }
.add-card h2 { font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--color-purple); margin: 0 0 var(--space-4); }
.add-card form { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.add-card input[type='text'] { flex: 1; min-width: 200px; padding: 0.65rem 0.85rem; border: 1.5px solid var(--color-cream-deep); border-radius: var(--radius-md); font-size: var(--text-sm); }
.add-card select { padding: 0.65rem 0.85rem; border: 1.5px solid var(--color-cream-deep); border-radius: var(--radius-md); font-size: var(--text-sm); background: var(--color-white); }
.add-card input:focus, .add-card select:focus { outline: none; border-color: var(--color-purple-light); }
.inline-checkbox { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); white-space: nowrap; }
.inline-checkbox--sub { margin-left: var(--space-4); color: var(--color-purple); font-size: var(--text-xs); }
.form-hint { font-size: var(--text-xs); color: var(--color-wine); margin-top: var(--space-2); }
.btn-primary { font-size: var(--text-sm); font-weight: 600; letter-spacing: var(--tracking-wide); background: var(--color-purple); color: var(--color-cream); padding: 0.65rem 1.2rem; border-radius: var(--radius-md); }
.btn-primary:hover:not(:disabled) { background: var(--color-purple-deep); }
.btn-primary:disabled { opacity: 0.55; cursor: default; }
.btn-secondary { font-size: var(--text-sm); font-weight: 600; background: var(--color-cream); color: var(--color-ink); padding: 0.65rem 1.2rem; border-radius: var(--radius-md); border: 1px solid var(--color-cream-deep); }
.list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
.list-header h2 { font-family: var(--font-serif); font-weight: 500; font-size: var(--text-lg); color: var(--color-ink); margin: 0; }
.staff-list { display: flex; flex-direction: column; gap: var(--space-3); }
.staff-card { background: var(--color-white); border: 1px solid var(--color-cream-deep); border-radius: var(--radius-lg); overflow: hidden; }
.staff-card.inactive { opacity: 0.55; }
.staff-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); flex-wrap: wrap; gap: var(--space-3); }
.staff-main { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.staff-name { font-family: var(--font-serif); font-weight: 600; font-size: var(--text-md); color: var(--color-ink); }
.staff-tags { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.tag { font-size: var(--text-xs); font-weight: 600; padding: 0.2rem 0.6rem; border-radius: var(--radius-full); }
.tag--type { background: var(--color-purple-ghost); color: var(--color-purple-deep); }
.tag--scope { background: var(--color-lemon-ghost); color: #6b6600; }
.tag--inactive { background: #fdecea; color: var(--color-wine); }
.staff-actions { display: flex; gap: var(--space-2); }
.row-action { font-size: var(--text-xs); font-weight: 600; padding: 0.4rem 0.8rem; border-radius: var(--radius-md); white-space: nowrap; }
.row-action--edit { color: var(--color-purple-deep); background: var(--color-purple-ghost); }
.row-action--remove { color: var(--color-wine); background: #fdecea; }
.row-action--restore { color: #155724; background: #d4edda; }
.assignment-editor { border-top: 1px solid var(--color-cream-deep); background: var(--color-cream); padding: var(--space-5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
.assignment-editor h3 { font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--color-purple); margin: 0 0 var(--space-3); }
.assignment-checklist { display: flex; flex-direction: column; gap: var(--space-2); max-height: 260px; overflow-y: auto; }
.assignment-row { display: flex; flex-direction: column; gap: var(--space-1); }
.arm-tag { font-size: 0.65rem; color: var(--color-ash-dark); background: var(--color-cream-deep); padding: 0.1rem 0.4rem; border-radius: var(--radius-sm); margin-left: var(--space-1); }
.assignment-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-cream-deep); }
@media (max-width: 640px) { .assignment-editor { grid-template-columns: 1fr; } }

.access-code-result { margin-top: var(--space-4); font-size: var(--text-sm); }
.access-code-result code { background: var(--color-cream-warm); padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); font-weight: 600; color: var(--color-purple-deep); }
</style>
</head>

    { href: '#/staff', title: 'Staff & Assignments', desc: 'Teaching roles, subjects, junior/senior scope, class arms.' },
    { href: '#/access-code', title: 'Student Access Code', desc: 'Rotate the shared code students use to view results.' },
    { href: '#/feed', title: 'Feed Posts', desc: 'Automatic — see note on this page.' }
  ];

  app.innerHTML = `
    <div class="landing">
      <svg class="landing-crest-watermark" viewBox="0 0 312.517888 359.467970" aria-hidden="true"><use href="#crest"/></svg>
      <header class="landing-header">
        <svg class="landing-crest" viewBox="0 0 312.517888 359.467970"><use href="#crest"/></svg>
        <h1>Tendercare Staff Dashboard</h1>
        <p>Roster management, staff assignments, and academic records for staff and admin.</p>
      </header>
      <div class="landing-grid">
        ${destinations.map(d => `
          <a class="landing-card" href="${d.href}">
            <span class="landing-card-title">${d.title}</span>
            <span class="landing-card-desc">${d.desc}</span>
            <span class="landing-card-arrow">&rarr;</span>
          </a>
        `).join('')}
      </div>
    </div>
  `;
}

// ─── #/ROSTER ──────────────────────────────────────────────────

let rosterState = { showInactive: false, confirmingEraseId: null };

function renderRoster(app) {
  renderShell(app, {
    title: 'Student Roster',
    subtitle: 'Tendercare Teacher Dashboard',
    bodyHtml: `<p class="loading-note">Loading…</p>`
  });
  renderRosterBody();
}

function renderRosterBody() {
  const content = document.getElementById('shell-content');
  const { showInactive, confirmingEraseId } = rosterState;
  const visible = STUDENTS.filter(s => showInactive || s.active);
  const activeCount = STUDENTS.filter(s => s.active).length;

  content.innerHTML = `
    <div class="roster-page">
      <header class="roster-header">
        <h1>Student Roster</h1>
        <p class="roster-subtitle">${activeCount} active students. Changes here take effect immediately.</p>
      </header>
      <div id="rosterError"></div>
      <section class="add-student">
        <h2>Add a student</h2>
        <form id="addStudentForm">
          <input type="text" id="newStudentName" placeholder="Full name" required />
          <select id="newStudentClass" required>
            ${HARDCODED_CLASSES.map(c => `<option value="${c.id}">${c.label}</option>`).join('')}
          </select>
          <button type="submit" id="addStudentBtn">Add student</button>
        </form>
      </section>
      <section class="roster-list">
        <div class="roster-list-header">
          <h2>Roster</h2>
          <label class="show-inactive-toggle">
            <input type="checkbox" id="showInactiveToggle" ${showInactive ? 'checked' : ''} />
            Show removed students
          </label>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${visible.map(s => `
              <tr class="${!s.active ? 'inactive-row' : ''}">
                <td>${s.id}</td><td>${s.full_name}</td>
                <td>${HARDCODED_CLASSES.find(c => c.id === s.class_id)?.label || s.class_id}</td>
                <td>${s.active ? 'Active' : 'Removed'}</td>
                <td class="actions-cell">
                  ${s.active
                    ? `<button class="btn-remove" data-remove="${s.id}">Remove</button>`
                    : `<button class="btn-restore" data-restore="${s.id}">Restore</button>
                       ${confirmingEraseId === s.id
                         ? `<span class="erase-confirm">Permanently erase — this also deletes their scores, remarks, and portal access. Cannot be undone.
                              <button class="btn-erase-confirm" data-erase-confirm="${s.id}">Confirm erase</button>
                              <button class="btn-cancel" data-erase-cancel="1">Cancel</button>
                            </span>`
                         : `<button class="btn-erase" data-erase="${s.id}">Permanently erase…</button>`}`
                  }
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </section>
    </div>
  `;

  document.getElementById('addStudentForm').addEventListener('submit', handleAddStudent);
  document.getElementById('showInactiveToggle').addEventListener('change', (e) => {
    rosterState.showInactive = e.target.checked;
    renderRosterBody();
  });
  content.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => handleRemoveStudent(b.dataset.remove)));
  content.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => handleRestoreStudent(b.dataset.restore)));
  content.querySelectorAll('[data-erase]').forEach(b => b.addEventListener('click', () => { rosterState.confirmingEraseId = b.dataset.erase; renderRosterBody(); }));
  content.querySelectorAll('[data-erase-confirm]').forEach(b => b.addEventListener('click', () => handlePermanentErase(b.dataset.eraseConfirm)));
  content.querySelectorAll('[data-erase-cancel]').forEach(b => b.addEventListener('click', () => { rosterState.confirmingEraseId = null; renderRosterBody(); }));
}

function showRosterError(msg) {
  const el = document.getElementById('rosterError');
  if (el) el.innerHTML = `<div class="page-error" role="alert">${msg}</div>`;
}

function handleAddStudent(e) {
  e.preventDefault();
  const name = document.getElementById('newStudentName').value.trim();
  const classId = document.getElementById('newStudentClass').value;
  if (!name || !classId) return;
  const btn = document.getElementById('addStudentBtn');
  btn.disabled = true;
  btn.textContent = 'Adding…';
  // Simulate async
  setTimeout(() => {
    const newId = 'TCH-2025-' + String(STUDENTS.length + 1).padStart(3, '0');
    STUDENTS.push({ id: newId, full_name: name, class_id: classId, active: true, deleted_at: null });
    renderRosterBody();
    btn.disabled = false;
    btn.textContent = 'Add student';
  }, 200);
}

function handleRemoveStudent(id) {
  const s = STUDENTS.find(st => st.id === id);
  if (s) { s.active = false; s.deleted_at = new Date().toISOString(); }
  renderRosterBody();
}

function handleRestoreStudent(id) {
  const s = STUDENTS.find(st => st.id === id);
  if (s) { s.active = true; s.deleted_at = null; }
  renderRosterBody();
}

function handlePermanentErase(id) {
  STUDENTS = STUDENTS.filter(s => s.id !== id);
  rosterState.confirmingEraseId = null;
  renderRosterBody();
}

// ─── #/STAFF ────────────────────────────────────────────────────

let staffUIState = { showInactive: false, editingId: null, editClasses: new Map(), editSubjects: new Set() };

function renderStaff(app) {
  renderShell(app, {
    title: 'Staff & Assignments',
    subtitle: 'Tendercare Teacher Dashboard',
    bodyHtml: `<p class="loading-note">Loading…</p>`
  });
  renderStaffBody();
}

function renderStaffBody() {
  const content = document.getElementById('shell-content');
  const { showInactive, editingId, editClasses, editSubjects } = staffUIState;
  const visible = STAFF.filter(s => showInactive || s.active);

  content.innerHTML = `
    <header class="page-header">
      <h1>Staff & Assignments</h1>
      <p class="page-subtitle">Each teacher's class-teaching/part-time role, the subjects they teach, junior/senior scope, and which class arms they're assigned to.</p>
    </header>
    <div id="staffError"></div>
    <section class="add-card">
      <h2>Add a Staff Member</h2>
      <form id="addStaffForm">
        <input type="text" id="newStaffName" placeholder="Full name" required />
        <select id="newStaffType">
          <option value="full_time">Full-time / Class Teacher</option>
          <option value="part_time">Part-time</option>
        </select>
        <label class="inline-checkbox"><input type="checkbox" id="newStaffJunior" /> Junior school</label>
        <label class="inline-checkbox"><input type="checkbox" id="newStaffSenior" /> Senior school</label>
        <button type="submit" class="btn-primary" id="addStaffBtn">Add Staff Member</button>
      </form>
      <p class="form-hint" id="staffFormHint" style="display:none">Select junior, senior, or both before adding.</p>
    </section>
    <div class="list-header">
      <h2>Staff Directory</h2>
      <label class="show-inactive-toggle">
        <input type="checkbox" id="staffShowInactive" ${showInactive ? 'checked' : ''} />
        Show deactivated staff
      </label>
    </div>
    ${visible.length === 0 ? '<p class="loading-note">No staff members yet.</p>' : `
    <div class="staff-list">
      ${visible.map(s => `
        <div class="staff-card ${!s.active ? 'inactive' : ''}">
          <div class="staff-row">
            <div class="staff-main">
              <span class="staff-name">${s.full_name}</span>
              <span class="staff-tags">
                <span class="tag tag--type">${s.employment_type === 'full_time' ? 'Full-time' : 'Part-time'}</span>
                ${s.teaches_junior ? '<span class="tag tag--scope">Junior</span>' : ''}
                ${s.teaches_senior ? '<span class="tag tag--scope">Senior</span>' : ''}
                ${!s.active ? '<span class="tag tag--inactive">Deactivated</span>' : ''}
              </span>
            </div>
            <div class="staff-actions">
              ${s.active
                ? `<button class="row-action row-action--edit" data-edit="${s.id}">Edit assignments</button>
                   <button class="row-action row-action--remove" data-deactivate="${s.id}">Deactivate</button>`
                : `<button class="row-action row-action--restore" data-reactivate="${s.id}">Reactivate</button>`}
            </div>
          </div>
          ${editingId === s.id ? renderAssignmentEditor(s) : ''}
        </div>
      `).join('')}
    </div>`}
  `;

  document.getElementById('addStaffForm').addEventListener('submit', handleAddStaff);
  document.getElementById('staffShowInactive').addEventListener('change', (e) => {
    staffUIState.showInactive = e.target.checked;
    renderStaffBody();
  });
  content.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openAssignmentEditor(b.dataset.edit)));
  content.querySelectorAll('[data-deactivate]').forEach(b => b.addEventListener('click', () => handleDeactivateStaff(b.dataset.deactivate)));
  content.querySelectorAll('[data-reactivate]').forEach(b => b.addEventListener('click', () => handleReactivateStaff(b.dataset.reactivate)));
  if (editingId) wireAssignmentEditor();
}

function renderAssignmentEditor(s) {
  const { editClasses, editSubjects } = staffUIState;
  return `
    <div class="assignment-editor">
      <div class="assignment-col">
        <h3>Classes Taught</h3>
        <div class="assignment-checklist">
          ${HARDCODED_CLASSES.map(c => {
            const assigned = editClasses.has(c.id);
            return `
              <div class="assignment-row">
                <label class="inline-checkbox">
                  <input type="checkbox" data-toggle-class="${c.id}" ${assigned ? 'checked' : ''} />
                  ${c.label} ${c.arm ? `<span class="arm-tag">${c.arm}</span>` : ''}
                </label>
                ${assigned ? `
                  <label class="inline-checkbox inline-checkbox--sub">
                    <input type="checkbox" data-toggle-classteacher="${c.id}" ${editClasses.get(c.id) ? 'checked' : ''} />
                    Class teacher
                  </label>` : ''}
              </div>`;
          }).join('')}
        </div>
      </div>
      <div class="assignment-col">
        <h3>Subjects Taught</h3>
        <div class="assignment-checklist">
          ${HARDCODED_SUBJECTS.map(subj => `
            <label class="inline-checkbox">
              <input type="checkbox" data-toggle-subject="${subj.id}" ${editSubjects.has(subj.id) ? 'checked' : ''} />
              ${subj.name}
            </label>
          `).join('')}
        </div>
      </div>
      <div class="assignment-actions">
        <button class="btn-secondary" id="cancelAssignments">Cancel</button>
        <button class="btn-primary" id="saveAssignments">Save assignments</button>
      </div>
    </div>
  `;
}

function wireAssignmentEditor() {
  document.querySelectorAll('[data-toggle-class]').forEach(el => el.addEventListener('change', (e) => {
    const id = e.target.dataset.toggleClass;
    if (staffUIState.editClasses.has(id)) staffUIState.editClasses.delete(id);
    else staffUIState.editClasses.set(id, false);
    renderStaffBody();
  }));
  document.querySelectorAll('[data-toggle-classteacher]').forEach(el => el.addEventListener('change', (e) => {
    const id = e.target.dataset.toggleClassteacher;
    staffUIState.editClasses.set(id, e.target.checked);
    renderStaffBody();
  }));
  document.querySelectorAll('[data-toggle-subject]').forEach(el => el.addEventListener('change', (e) => {
    const id = e.target.dataset.toggleSubject;
    if (staffUIState.editSubjects.has(id)) staffUIState.editSubjects.delete(id);
    else staffUIState.editSubjects.add(id);
    renderStaffBody();
  }));
  document.getElementById('cancelAssignments').addEventListener('click', () => {
    staffUIState.editingId = null;
    renderStaffBody();
  });
  document.getElementById('saveAssignments').addEventListener('click', handleSaveAssignments);
}

function showStaffError(msg) {
  const el = document.getElementById('staffError');
  if (el) el.innerHTML = `<div class="page-error" role="alert">${msg}</div>`;
}

function handleAddStaff(e) {
  e.preventDefault();
  const name = document.getElementById('newStaffName').value.trim();
  const type = document.getElementById('newStaffType').value;
  const junior = document.getElementById('newStaffJunior').checked;
  const senior = document.getElementById('newStaffSenior').checked;
  const hint = document.getElementById('staffFormHint');
  if (!name || (!junior && !senior)) { hint.style.display = 'block'; return; }
  hint.style.display = 'none';
  const btn = document.getElementById('addStaffBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  setTimeout(() => {
    const newId = 'staff_' + (STAFF.length + 1);
    STAFF.push({ id: newId, full_name: name, employment_type: type, teaches_junior: junior, teaches_senior: senior, active: true });
    STAFF_CLASSES[newId] = {};
    STAFF_SUBJECTS[newId] = [];
    renderStaffBody();
    btn.disabled = false; btn.textContent = 'Add Staff Member';
  }, 200);
}

function handleDeactivateStaff(id) {
  const s = STAFF.find(st => st.id === id);
  if (s) s.active = false;
  renderStaffBody();
}

function handleReactivateStaff(id) {
  const s = STAFF.find(st => st.id === id);
  if (s) s.active = true;
  renderStaffBody();
}

function openAssignmentEditor(staffId) {
  staffUIState.editingId = staffId;
  const classes = STAFF_CLASSES[staffId] || {};
  staffUIState.editClasses = new Map(Object.entries(classes));
  staffUIState.editSubjects = new Set(STAFF_SUBJECTS[staffId] || []);
  renderStaffBody();
}

function handleSaveAssignments() {
  const staffId = staffUIState.editingId;
  const btn = document.getElementById('saveAssignments');
  btn.disabled = true; btn.textContent = 'Saving…';
  setTimeout(() => {
    STAFF_CLASSES[staffId] = Object.fromEntries(staffUIState.editClasses);
    STAFF_SUBJECTS[staffId] = Array.from(staffUIState.editSubjects);
    staffUIState.editingId = null;
    renderStaffBody();
    btn.disabled = false; btn.textContent = 'Save assignments';
  }, 200);
}

// ─── #/ACCESS-CODE ─────────────────────────────────────────────

function renderAccessCode(app) {
  renderShell(app, {
    title: 'Student Access Code',
    subtitle: 'Tendercare Teacher Dashboard',
    bodyHtml: `
      <header class="page-header">
        <h1>Student Access Code</h1>
        <p class="page-subtitle">The single shared password every student uses, alongside their own ID, to view their result. Rotating it invalidates the old code immediately for all students.</p>
      </header>
      <div id="accessCodeError"></div>
      <section class="add-card">
        <h2>Rotate Code</h2>
        <p class="form-hint" style="color:var(--color-ash-dark);margin-bottom:var(--space-3)">
          Generates a new random code and applies it to every active student's portal login in one operation.
        </p>
        <button class="btn-primary" id="rotateCodeBtn">Generate & apply new code</button>
        <div id="newCodeDisplay"></div>
      </section>
    `
  });
  document.getElementById('rotateCodeBtn').addEventListener('click', handleRotateCode);
}

function handleRotateCode() {
  const btn = document.getElementById('rotateCodeBtn');
  const display = document.getElementById('newCodeDisplay');
  btn.disabled = true; btn.textContent = 'Generating…';
  setTimeout(() => {
    const code = 'TC-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const count = STUDENTS.filter(s => s.active).length;
    display.innerHTML = `<p class="access-code-result">New code: <code>${code}</code> — applied to ${count} active students.</p>`;
    btn.disabled = false; btn.textContent = 'Generate & apply new code';
  }, 300);
}

// ─── #/FEED ─────────────────────────────────────────────────────

function renderFeed(app) {
  renderShell(app, {
    title: 'Feed Posts',
    subtitle: 'Tendercare Teacher Dashboard',
    bodyHtml: `
      <header class="page-header">
        <h1>Feed Posts</h1>
        <p class="page-subtitle">Notices posted to the public site. This is an automatic process — posts appear here as a log.</p>
      </header>
      <div id="feedError"></div>
      <section id="feedList"><p class="loading-note">Loading…</p></section>
    `
  });
  const posts = HARDCODED_FEED;
  document.getElementById('feedList').innerHTML = posts.length
    ? `<div class="staff-list">${posts.map(p => `
        <div class="staff-card">
          <div class="staff-row">
            <div class="staff-main">
              <span class="staff-name">${p.title ?? '(untitled)'}</span>
              <span class="staff-tags">${p.pinned ? '<span class="tag tag--scope">Pinned</span>' : ''}</span>
            </div>
            <span style="font-size:var(--text-xs);color:var(--color-ash-dark)">${new Date(p.created_at).toLocaleDateString()}</span>
          </div>
        </div>
      `).join('')}</div>`
    : '<p class="loading-note">No posts yet.</p>';
}
</script>

</body>
</html>
